<!DOCTYPE html>
<html lang="zh-CN" class="dark h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="书写代码、设计与边缘计算的个人博客。在秩序与混沌的交界处，寻找属于自己的巨石碑。" />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- Open Graph 默认标签（SPA 首次抓取时的兜底） -->
    <meta property="og:title" content="Monolith — 代码、设计与边缘计算" />
    <meta property="og:description" content="书写代码、设计与边缘计算的个人博客。在秩序与混沌的交界处，寻找属于自己的巨石碑。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Monolith" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:image" content="/og-default.png" />

    <!-- Twitter Card 默认标签 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Monolith — 代码、设计与边缘计算" />
    <meta name="twitter:description" content="书写代码、设计与边缘计算的个人博客。" />
    <meta name="twitter:image" content="/og-default.png" />

    <title>Monolith — 代码、设计与边缘计算</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate" type="application/rss+xml" title="Monolith RSS" href="/rss.xml" />
  </head>
  <body class="min-h-full flex flex-col font-sans bg-background text-foreground">
    <!-- 主题初始化：在 React 加载前设置 data-theme / data-style，防止闪烁 -->
    <script>
      (function(){
        // 明暗模式（白名单校验，异常回退默认，防止非法值/存储阻断中断初始化）
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        var validModes = ['dark', 'light', 'system'];
        var mode = validModes.indexOf(t) >= 0 ? t : 'dark';
        var d = mode === 'system'
          ? (window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light')
          : mode;
        document.documentElement.setAttribute('data-theme', d);
        // 视觉风格（多主题，白名单校验）
        var st = null;
        try { st = localStorage.getItem('monolith-theme-style'); } catch (e) {}
        var validStyles = ['default', 'fluid'];
        var style = validStyles.indexOf(st) >= 0 ? st : 'default';
        document.documentElement.setAttribute('data-style', style);
        // 同步 theme-color
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) {
          m.setAttribute('content', style === 'fluid'
            ? (d === 'light' ? '#f6f4fb' : '#0d0b1a')
            : (d === 'light' ? '#ffffff' : '#0a0a0f'));
        }
      })();
    </script>
    <div id="root" class="min-h-screen flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
