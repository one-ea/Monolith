name: Cloudflare Deploy

# 手动触发的生产部署工作流（不覆盖业务 secret 的分步链路）：
#   远程 D1 migrations → schema reconcile → Workers 部署 → Pages API_BASE → 前端构建 → Pages 部署 → 健康检查
# ADMIN_PASSWORD / JWT_SECRET / REACTION_SALT 等业务 secret 全程不被触碰（无需配置为 Actions secret）。
# 所需 Actions secret：
#   CLOUDFLARE_API_TOKEN（必需）— Workers/Pages/D1 部署权限
#   CLOUDFLARE_ACCOUNT_ID（必需）— 32 位十六进制账户 ID；API Token 模式下无法可靠自动探测
# 触发：Actions 页面手动运行；日常推送不自动部署（生产部署须明确下令）。

on:
  workflow_dispatch:
    inputs:
      pages_branch:
        description: Pages 部署目标分支（main=生产，dev=预览）
        required: true
        default: main
        type: choice
        options:
          - main
          - dev
      skip_migrate:
        description: 跳过远程数据库迁移
        required: true
        default: false
        type: boolean
      skip_reconcile:
        description: 跳过 D1 schema reconcile（仅高级排错使用）
        required: true
        default: false
        type: boolean
      skip_server:
        description: 跳过 Workers 后端部署
        required: true
        default: false
        type: boolean
      skip_client:
        description: 跳过 Pages 前端部署
        required: true
        default: false
        type: boolean
      api_base:
        description: 手动指定 API_BASE（留空则自动探测本次 Workers URL）
        required: false
        type: string

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare (no-secret-overwrite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight (token & inputs)
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::缺少 Actions secret CLOUDFLARE_API_TOKEN（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::缺少 Actions secret CLOUDFLARE_ACCOUNT_ID（32 位十六进制账户 ID）"
            exit 1
          fi
          if ! printf '%s' "${CLOUDFLARE_ACCOUNT_ID}" | grep -Eq '^[0-9a-fA-F]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID 格式无效：需要 32 位十六进制"
            exit 1
          fi
          echo "pages_branch=${{ inputs.pages_branch }}"
          npx wrangler whoami --json || echo "::warning::wrangler whoami 无法读取用户信息（API Token 权限受限）；继续使用显式 CLOUDFLARE_ACCOUNT_ID"

      - name: Reconcile D1 schema (pre-migration)
        if: ${{ !inputs.skip_reconcile }}
        working-directory: server
        run: node ../scripts/reconcile-d1-schema.mjs --remote

      - name: Repair D1 migration ledger
        if: ${{ !inputs.skip_migrate }}
        working-directory: server
        run: node ../scripts/repair-d1-migrations.mjs --remote

      - name: Apply remote D1 migrations
        if: ${{ !inputs.skip_migrate }}
        working-directory: server
        run: printf 'y\n' | npx wrangler d1 migrations apply monolith-db --remote

      - name: Reconcile D1 schema (post-migration)
        if: ${{ !inputs.skip_reconcile }}
        working-directory: server
        run: node ../scripts/reconcile-d1-schema.mjs --remote

      - name: Deploy Workers backend
        if: ${{ !inputs.skip_server }}
        working-directory: server
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --var CLOUDFLARE_ACCOUNT_ID:${CLOUDFLARE_ACCOUNT_ID} 2>&1 | tee /tmp/deploy-server.log
          WORKERS_URL="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy-server.log | tail -1 || true)"
          if [ -n "${WORKERS_URL}" ]; then
            echo "WORKERS_URL=${WORKERS_URL}" >> "$GITHUB_ENV"
            echo "Workers URL: ${WORKERS_URL}"
          else
            echo "::warning::未能从部署输出解析 workers.dev URL"
          fi

      - name: Resolve API_BASE
        run: |
          API_BASE="${{ inputs.api_base }}"
          if [ -z "${API_BASE}" ]; then API_BASE="${WORKERS_URL}"; fi
          if [ -z "${API_BASE}" ]; then
            echo "::error::无法确定 API_BASE：请手动指定 api_base 输入，或不要跳过 Workers 部署"
            exit 1
          fi
          echo "API_BASE=${API_BASE}" >> "$GITHUB_ENV"
          echo "API_BASE=${API_BASE}"

      - name: Set Pages API_BASE secret
        if: ${{ !inputs.skip_client }}
        run: |
          if [ "${{ inputs.pages_branch }}" = "main" ]; then PAGES_ENV="production"; else PAGES_ENV="preview"; fi
          printf '%s\n' "${API_BASE}" | npx wrangler pages secret put API_BASE --project-name monolith-client --env "${PAGES_ENV}"

      - name: Build frontend
        if: ${{ !inputs.skip_client }}
        run: npm run build

      - name: Deploy Pages frontend
        if: ${{ !inputs.skip_client }}
        shell: bash
        run: |
          set -o pipefail
          npx wrangler pages deploy dist --project-name monolith-client \
            --branch "${{ inputs.pages_branch }}" \
            --commit-dirty=true \
            --commit-message "deploy ${{ github.sha }}" 2>&1 | tee /tmp/pages-deploy.log
          PAGES_URL="$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' /tmp/pages-deploy.log | tail -1 || true)"
          if [ -n "${PAGES_URL}" ]; then echo "PAGES_URL=${PAGES_URL}" >> "$GITHUB_ENV"; fi
        working-directory: client

      - name: Post-deploy health check
        if: ${{ !inputs.skip_client }}
        run: |
          BASE="${PAGES_URL:-https://monolith-client.pages.dev}"
          fail=0
          for path in / /robots.txt /sitemap.xml /rss.xml /api/health /api/friends; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${BASE}${path}")"
            echo "${code} ${BASE}${path}"
            case "${code}" in 2*|3*) ;; *) fail=1 ;; esac
          done
          if [ -n "${WORKERS_URL}" ]; then
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${WORKERS_URL}/api/health")"
            echo "${code} ${WORKERS_URL}/api/health"
            case "${code}" in 2*|3*) ;; *) fail=1 ;; esac
          fi
          exit "${fail}"
